[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jrock"
version = "0.1.0"
description = "Permissioned Telegram AI agent and independent Bitunix futures engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "python-telegram-bot>=22,<23", "numpy>=2.0,<3", "websockets>=15,<16",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
jrock = "jrock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jrock = ["resources/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
